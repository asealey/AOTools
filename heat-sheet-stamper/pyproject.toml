[project]
name = "heat-sheet-stamper"
version = "0.1.0"
description = "Adds a DQ / NS / DFS scoring stamp to the bottom-right corner of every page in a swim meet heat sheet PDF"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=6,<7",
    "reportlab>=4",
]

[dependency-groups]
dev = [
    "pylint",
    "pytest",
    "pymupdf",  # PDF-to-image rendering for README screenshot generation
]
